<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLimit</title>
  <style>
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
      overflow-x: hidden;
      user-select: none;
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .counter {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .waiting-counter {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 0.8rem;
      letter-spacing: 0.05em;
    }

    .status {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
      color: #32d74b;
    }

    .status-full {
      color: #ff453a !important;
    }

    .btn {
      padding: 16px 48px;
      font-size: 1.1rem;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      margin-top: 0.5rem;
    }

    .btn:disabled {
      background: #444444;
      color: #888888;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.25);
    }

    .timer {
      font-size: 4rem;
      font-weight: 800;
      color: #ff3b30;
      margin-top: 1rem;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
    }

    .video-preview-box {
      width: 220px;
      height: 390px;
      max-width: 80vw;
      max-height: 45vh;
      background: #111;
      border-radius: 20px;
      margin: 0.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .video-preview-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
    }

    .mosaic-box {
      width: 320px;
      max-width: 85vw;
      height: 320px;
      max-height: 85vw;
      background: #111;
      border-radius: 20px;
      margin: 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .mosaic-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #444;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- 画面1：待機画面 -->
  <div id="screen-locked" style="text-align: center;">
    <div class="brand-title">OpenLimit</div>
    <div class="counter">累計OPEN回数: <span id="total-count-val">...</span></div>
    <!-- リアルタイム待機人数の表示エリア -->
    <div class="waiting-counter">現在待機中のユーザー: <span id="waiting-users-val" style="color: #007aff; font-weight:700;">0</span> 人</div>
    
    <div class="video-preview-box">
      <iframe 
        src="https://www.youtube.com/embed/FUaDAHyyvPM?autoplay=1&mute=1&loop=1&playlist=FUaDAHyyvPM&controls=0&rel=0" 
        title="LUCKYオモーチー YouTube Short Preview" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div id="status-display" class="status">OPEN (<span id="active-users-val">0</span>/10)</div>
    <button id="main-btn"
