<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLimit</title>
  <style>
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
      overflow-x: hidden;
      user-select: none;
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .counter {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    .status {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    .status-locked {
      color: #ff453a;
    }

    .status-unlocked {
      color: #32d74b;
    }

    .btn {
      padding: 16px 48px;
      font-size: 1.1rem;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.25);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .timer {
      font-size: 4rem;
      font-weight: 800;
      color: #ff3b30;
      margin-top: 1rem;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
    }

    /* 画像表示エリアを大きく（320px×320px）変更 */
    .mosaic-box {
      width: 320px;
      max-width: 85vw;
      height: 320px;
      max-height: 85vw;
      background: #111;
      border-radius: 20px;
      margin: 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .mosaic-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #444;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- 画面1：待機 / 満員（FULL）画面 -->
  <div id="screen-locked" style="text-align: center;">
    <div class="brand-title">OpenLimit</div>
    <div id="total-count-label" class="counter">Total OPENs: <span id="total-count">0</span></div>
    <div id="status-label" class="status status-unlocked">OPEN (9/10)</div>
    <button id="open-btn" class="btn" onclick="tryOpen()">TRY TO OPEN</button>
  </div>

  <!-- 画面2：30秒間の開放画面 -->
  <div id="screen-unlocked" class="hidden" style="text-align: center;">
    <div class="brand-title">OpenLimit</div>
    <div id="congrats-label" class="counter" style="color: #32d74b; font-weight:700;">CONGRATULATIONS!</div>
    <div id="opener-number" style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem;">You are the #1 OPENer</div>
    
    <!-- 大型化した画像エリア（お好きな画像URLやファイル名に差し替え可能） -->
    <div class="mosaic-box">
      <img id="display-image" src="https://via.placeholder.com/400/111111/ffffff?text=OpenLimit" alt="OpenLimit Content">
    </div>
    
    <div id="timer" class="timer">00:30</div>
  </div>

  <div class="footer-note">OpenLimit &copy; 2026 — 10 Users / 30 Seconds Limit</div>

  <script>
    const MAX_USERS = 10;
    const LIMIT_SECONDS = 30; // 30秒強制終了
    let currentUsers = 9;     // 1枠空けた状態

    // ローカルストレージから累計カウントを読み込み（なければ0スタート）
    let totalOpens = parseInt(localStorage.getItem('openlimit_total_opens') || '0', 10);
    let userLang = navigator.language.startsWith('ja') ? 'ja' : 'en';

    // 初期カウント表示更新
    updateCounterUI();

    function updateCounterUI() {
      const countEl = document.getElementById('total-count');
      if (countEl) countEl.innerText = totalOpens.toLocaleString();

      if (userLang === 'ja') {
        document.getElementById('total-count-label').innerHTML = `累計OPEN回数: <span id="total-count">${totalOpens.toLocaleString()}</span>`;
        document.getElementById('open-btn').innerText = '扉を開ける';
      }
    }

    function tryOpen() {
      if (currentUsers >= MAX_USERS) {
        alert(userLang === 'ja' 
          ? '現在満員です（10/10）。時間をおいて再度お試しください。' 
          : 'FULL! (10/10). Doors are locked.');
        return;
      }

      enterOpenRoom();
    }

    function enterOpenRoom() {
      // 開くごとにカウントを増やす＆保存
      totalOpens++;
      localStorage.setItem('openlimit_total_opens', totalOpens);

      document.getElementById('screen-locked').classList.add('hidden');
      document.getElementById('screen-unlocked').classList.remove('hidden');

      if (userLang === 'ja') {
        document.getElementById('congrats-label').innerText = 'CONGRATULATIONS!';
        document.getElementById('opener-number').innerText = `あなたは ${totalOpens.toLocaleString()} 人目の OPENer です！`;
      } else {
        document.getElementById('opener-number').innerText = `You are the #${totalOpens.toLocaleString()} OPENer`;
      }

      // 30秒タイマー開始
      let timeLeft = LIMIT_SECONDS;
      const timerEl = document.getElementById('timer');
