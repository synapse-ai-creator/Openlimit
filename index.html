<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLimit</title>
  <style>
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
      overflow-x: hidden;
      user-select: none;
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .counter {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .waiting-counter {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    .status {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
      color: #32d74b;
    }

    .status-full {
      color: #ff453a !important;
    }

    .btn {
      padding: 18px 52px;
      font-size: 1.2rem;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
    }

    .btn:disabled {
      background: #444444;
      color: #888888;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
    }

    .timer {
      font-size: 4rem;
      font-weight: 800;
      color: #ff3b30;
      margin-top: 1rem;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
    }

    .mosaic-box {
      width: 320px;
      max-width: 85vw;
      height: 320px;
      max-height: 85vw;
      background: #111;
      border-radius: 20px;
      margin: 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .mosaic-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #444;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- 画面1：待機画面 -->
  <div id="screen-locked" style="text-align: center; width: 100%;">
    <div class="brand-title">OpenLimit</div>
    <div class="counter"><span id="lbl-total-counter">累計OPEN回数</span>: <span id="total-count-val">...</span></div>
    <div class="waiting-counter"><span id="lbl-waiting-users">現在待機中のユーザー</span>: <span id="waiting-users-val" style="color: #007aff; font-weight:700;">0</span> <span id="lbl-unit-people">人</span></div>

    <div id="status-display" class="status">
      <span id="status-text">OPEN</span> (<span id="active-users-val">0</span>/10)
    </div>
    
    <button id="main-btn" class="btn">OPEN</button>
  </div>

  <!-- 画面2：30秒間の開放画面 -->
  <div id="screen-unlocked" class="hidden" style="text-align: center; width: 100%;">
    <div class="brand-title">OpenLimit</div>
    <div class="counter" style="color: #32d74b; font-weight:700;">CONGRATULATIONS!</div>
    <div id="opener-number" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem;">...</div>
    
    <div class="mosaic-box">
      <img src="https://via.placeholder.com/400/111111/ffffff?text=OpenLimit" alt="OpenLimit Content">
    </div>
    
    <div id="timer" class="timer">00:30</div>
  </div>

  <div class="footer-note">OpenLimit &copy; 2026 — 10 Users / 30 Seconds Limit</div>

  <script>
    // --- 多言語辞書 (i18n) ---
    const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    const isJapanese = userLang.startsWith('ja');

    const i18n = {
      totalCounter: isJapanese ? '累計OPEN回数' : 'Total Opens',
      waitingUsers: isJapanese ? '現在待機中のユーザー' : 'Waiting Users',
      unitPeople: isJapanese ? '人' : '',
      btnOpen: isJapanese ? '扉を開ける' : 'OPEN',
      btnFull: isJapanese ? '満員です' : 'FULL',
      openerText: (num) => isJapanese ? `あなたは ${num} 人目の OPENer です！` : `You are OPENer #${num}!`,
      alertTimeout: isJapanese ? '30秒が経過しました。強制ログアウトします。' : '30 seconds have passed. Auto logged out.',
      alertFull: isJapanese ? '現在満員です（10/10）。時間をおいて再度お試しください。' : 'Currently FULL (10/10). Please try again later.'
    };

    // 初期言語設定を反映
    document.getElementById('lbl-total-counter').innerText = i18n.totalCounter;
    document.getElementById('lbl-waiting-users').innerText = i18n.waitingUsers;
    document.getElementById('lbl-unit-people').innerText = i18n.unitPeople;
    document.getElementById('main-btn').innerText = i18n.btnOpen;

    // --- Firebase設定 ---
    const firebaseConfig = {
      databaseURL: "https://openlimit-f7d81-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const MAX_USERS = 10;
    let currentGlobalOpens = 0;
    let currentActiveUsers = 0;
    let myWaitingRef = null;
    let myActiveRef = null;

    // 1. 待機ユーザー登録
    myWaitingRef = db.ref('waitingSessions').push();
    myWaitingRef.set(true);
    myWaitingRef.onDisconnect().remove();

    // 2. 累計OPEN数監視
    db.ref('totalOpens').on('value', (snapshot) => {
      currentGlobalOpens = snapshot.val() || 0;
      document.getElementById('total-count-val').innerText = currentGlobalOpens.toLocaleString();
    });

    // 3. 待機人数監視
    db.ref('waitingSessions').on('value', (snapshot) => {
      const waitingData = snapshot.val() || {};
      const waitingCount = Object.keys(waitingData).length;
      document.getElementById('waiting-users-val').innerText = waitingCount;
    });

    // 4. 同時接続人数監視
    db.ref('activeSessions').on('value', (snapshot) => {
      const activeData = snapshot.val() || {};
      currentActiveUsers = Object.keys(activeData).length;
      
      const userValEl = document.getElementById('active-users-val');
      const statusTextEl = document.getElementById('status-text');
      const statusDisplayEl = document.getElementById('status-display');
      const btnEl = document.getElementById('main-btn');

      if (userValEl) userValEl.innerText = currentActiveUsers;

      if (currentActiveUsers >= MAX_USERS) {
        if (statusTextEl) statusTextEl.innerText = 'FULL';
        if (statusDisplayEl) statusDisplayEl.classList.add('status-full');
        btnEl.disabled = true;
        btnEl.innerText = i18n.btnFull;
      } else {
        if (statusTextEl) statusTextEl.innerText = 'OPEN';
        if (statusDisplayEl) statusDisplayEl.classList.remove('status-full');
        btnEl.disabled = false;
        btnEl.innerText = i18n.btnOpen;
      }
    });

    // 「扉を開ける / OPEN」ボタンアクション
    document.getElementById('main-btn').addEventListener('click', function() {
      if (currentActiveUsers >= MAX_USERS) {
        alert(i18n.alertFull);
        return;
      }

      const btnEl = document.getElementById('main-btn');
      btnEl.disabled = true;

      db.ref('totalOpens').transaction((current) => {
        return (current || 0) + 1;
      }, (error, committed, snapshot) => {
        if (error || !committed) {
          btnEl.disabled = false;
          alert('Error occurred. Please try again.');
          return;
        }

        const finalOpenNumber = snapshot.val();

        if (myWaitingRef) {
          myWaitingRef.remove();
        }

        myActiveRef = db.ref('activeSessions').push();
        myActiveRef.set(true);
        myActiveRef.onDisconnect().remove();

        document.getElementById('screen-locked').classList.add('hidden');
        document.getElementById('screen-unlocked').classList.remove('hidden');
        document.getElementById('opener-number').innerText = i18n.openerText(finalOpenNumber.toLocaleString());

        let timeLeft = 30;
        const timerEl = document.getElementById('timer');
        
        const interval = setInterval(() => {
          timeLeft--;
          let sec = timeLeft < 10 ? '0' + timeLeft : timeLeft;
          timerEl.innerText = `00:${sec}`;

          if (timeLeft <= 0) {
            clearInterval(interval);
            if (myActiveRef) myActiveRef.remove();
            alert(i18n.alertTimeout);
            location.reload();
          }
        }, 1000);
      });
    });
  </script>
</body>
</html>
