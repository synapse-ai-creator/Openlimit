<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLimit</title>
  <style>
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0.8rem;
      box-sizing: border-box;
      overflow-x: hidden;
      user-select: none;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .counter {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 0.2rem;
      letter-spacing: 0.05em;
    }

    .waiting-counter {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .status {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.4rem;
      margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
      color: #32d74b;
    }

    .status-full {
      color: #ff453a !important;
    }

    .btn {
      padding: 14px 40px;
      font-size: 1rem;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      margin-top: 0.4rem;
    }

    .btn:disabled {
      background: #444444;
      color: #888888;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.25);
    }

    .timer {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ff3b30;
      margin-top: 0.5rem;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
    }

    /* 画面サイズに合わせて自動縮小する動画プレイヤー（画面外はみ出し防止） */
    .video-preview-box {
      width: 180px;
      height: 320px;
      max-width: 70vw;
      max-height: 38vh;
      background: #111;
      border-radius: 16px;
      margin: 0.3rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .video-preview-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
    }

    .mosaic-box {
      width: 300px;
      max-width: 80vw;
      height: 300px;
      max-height: 80vw;
      background: #111;
      border-radius: 20px;
      margin: 0.8rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .mosaic-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      position: relative;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- 画面1：待機画面 -->
  <div id="screen-locked" style="text-align: center; width: 100%;">
    <div class="brand-title">OpenLimit</div>
    <div class="counter">累計OPEN回数: <span id="total-count-val">...</span></div>
    <div class="waiting-counter">現在待機中のユーザー: <span id="waiting-users-val" style="color: #007aff; font-weight:700;">0</span> 人</div>
    
    <div class="video-preview-box">
      <iframe 
        src="https://www.youtube.com/embed/FUaDAHyyvPM?autoplay=1&mute=1&loop=1&playlist=FUaDAHyyvPM&controls=0&rel=0" 
        title="LUCKYオモーチー YouTube Short Preview" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div id="status-display" class="status">
      <span id="status-text">OPEN</span> (<span id="active-users-val">0</span>/10)
    </div>
    
    <button id="main-btn" class="btn">扉を開ける</button>
  </div>

  <!-- 画面2：30秒間の開放画面 -->
  <div id="screen-unlocked" class="hidden" style="text-align: center; width: 100%;">
    <div class="brand-title">OpenLimit</div>
    <div class="counter" style="color: #32d74b; font-weight:700;">CONGRATULATIONS!</div>
    <div id="opener-number" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem;">あなたは ... 人目の OPENer です！</div>
    
    <div class="mosaic-box">
      <img src="https://via.placeholder.com/400/111111/ffffff?text=OpenLimit" alt="OpenLimit Content">
    </div>
    
    <div id="timer" class="timer">00:30</div>
  </div>

  <div class="footer-note">OpenLimit &copy; 2026 — 10 Users / 30 Seconds Limit</div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://openlimit-f7d81-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const MAX_USERS = 10;
    let currentGlobalOpens = 0;
    let currentActiveUsers = 0;
    let myWaitingRef = null;
    let myActiveRef = null;

    // 1. 待機ユーザー登録
    myWaitingRef = db.ref('waitingSessions').push();
    myWaitingRef.set(true);
    myWaitingRef.onDisconnect().remove();

    // 2. 累計OPEN数監視
    db.ref('totalOpens').on('value', (snapshot) => {
      currentGlobalOpens = snapshot.val() || 0;
      document.getElementById('total-count-val').innerText = currentGlobalOpens.toLocaleString();
    });

    // 3. 待機人数監視
    db.ref('waitingSessions').on('value', (snapshot) => {
      const waitingData = snapshot.val() || {};
      const waitingCount = Object.keys(waitingData).length;
      document.getElementById('waiting-users-val').innerText = waitingCount;
    });

    // 4. 同時接続人数監視（上限10人制御）
    db.ref('activeSessions').on('value', (snapshot) => {
      const activeData = snapshot.val() || {};
      currentActiveUsers = Object.keys(activeData).length;
      
      const userValEl = document.getElementById('active-users-val');
      const statusTextEl = document.getElementById('status-text');
      const statusDisplayEl = document.getElementById('status-display');
      const btnEl = document.getElementById('main-btn');

      if (userValEl) userValEl.innerText = currentActiveUsers;

      if (currentActiveUsers >= MAX_USERS) {
        if (statusTextEl) statusTextEl.innerText = 'FULL';
        if (statusDisplayEl) statusDisplayEl.classList.add('status-full');
        btnEl.disabled = true;
        btnEl.innerText = '満員です';
      } else {
        if (statusTextEl) statusTextEl.innerText = 'OPEN';
        if (statusDisplayEl) statusDisplayEl.classList.remove('status-full');
        btnEl.disabled = false;
        btnEl.innerText = '扉を開ける';
      }
    });

    // 「扉を開ける」アクション
    document.getElementById('main-btn').addEventListener('click', function() {
      if (currentActiveUsers >= MAX_USERS) {
        alert('現在満員です（10/10）。時間をおいて再度お試しください。');
        return;
      }

      if (myWaitingRef) {
        myWaitingRef.remove();
      }

      db.ref('totalOpens').transaction((current) => {
        return (current || 0) + 1;
      });

      myActiveRef = db.ref('activeSessions').push();
      myActiveRef.set(true);
      myActiveRef.onDisconnect().remove();

      document.getElementById('screen-locked').classList.add('hidden');
      document.getElementById('screen-unlocked').classList.remove('hidden');
      document.getElementById('opener-number').innerText = `あなたは ${currentGlobalOpens + 1} 人目の OPENer です！`;

      let timeLeft = 30;
      const timerEl = document.getElementById('timer');
      
      const interval = setInterval(() => {
        timeLeft--;
        let sec = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        timerEl.innerText = `00:${sec}`;

        if (timeLeft <= 0) {
          clearInterval(interval);
          if (myActiveRef) myActiveRef.remove();
          alert('30秒が経過しました。強制ログアウトします。');
          location.reload();
        }
      }, 1000);
    });
  </script>
</body>
</html>
