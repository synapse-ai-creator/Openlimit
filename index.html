<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLimit</title>
  <style>
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
      overflow-x: hidden;
      user-select: none;
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .counter {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 0.8rem;
      letter-spacing: 0.05em;
    }

    .status {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
      color: #32d74b;
    }

    .btn {
      padding: 16px 48px;
      font-size: 1.1rem;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      margin-top: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.25);
    }

    .timer {
      font-size: 4rem;
      font-weight: 800;
      color: #ff3b30;
      margin-top: 1rem;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
    }

    /* 待機画面用の動画エリア（9:16比率） */
    .video-preview-box {
      width: 220px;
      height: 390px;
      max-width: 80vw;
      max-height: 45vh;
      background: #111;
      border-radius: 20px;
      margin: 0.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .video-preview-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
    }

    /* 開放後の画像エリア（大きめのスクエア表示） */
    .mosaic-box {
      width: 320px;
      max-width: 85vw;
      height: 320px;
      max-height: 85vw;
      background: #111;
      border-radius: 20px;
      margin: 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .mosaic-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #444;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- 画面1：待機画面（開ける前にShorts動画を表示） -->
  <div id="screen-locked" style="text-align: center;">
    <div class="brand-title">OpenLimit</div>
    <div class="counter">累計OPEN回数: <span id="total-count-val">0</span></div>
    
    <!-- 開く前専用のYouTube動画プレビュー -->
    <div class="video-preview-box">
      <iframe 
        src="https://www.youtube.com/embed/FUaDAHyyvPM?autoplay=1&mute=1&loop=1&playlist=FUaDAHyyvPM&controls=0&rel=0" 
        title="LUCKYオモーチー YouTube Short Preview" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="status">OPEN (0/10)</div>
    <button id="main-btn" class="btn">扉を開ける</button>
  </div>

  <!-- 画面2：30秒間の開放画面（動画なし・画像＆タイマーのみ） -->
  <div id="screen-unlocked" class="hidden" style="text-align: center;">
    <div class="brand-title">OpenLimit</div>
    <div class="counter" style="color: #32d74b; font-weight:700;">CONGRATULATIONS!</div>
    <div id="opener-number" style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem;">あなたは 1 人目の OPENer です！</div>
    
    <!-- 開放後の大型画像表示エリア -->
    <div class="mosaic-box">
      <img src="https://via.placeholder.com/400/111111/ffffff?text=OpenLimit" alt="OpenLimit Content">
    </div>
    
    <div id="timer" class="timer">00:30</div>
  </div>

  <div class="footer-note">OpenLimit &copy; 2026 — 10 Users / 30 Seconds Limit</div>

  <script>
    let totalOpens = parseInt(localStorage.getItem('openlimit_total_opens') || '0', 10);
    document.getElementById('total-count-val').innerText = totalOpens.toLocaleString();

    document.getElementById('main-btn').addEventListener('click', function() {
      totalOpens++;
      localStorage.setItem('openlimit_total_opens', totalOpens);

      document.getElementById('screen-locked').classList.add('hidden');
      document.getElementById('screen-unlocked').classList.remove('hidden');
      document.getElementById('opener-number').innerText = `あなたは ${totalOpens.toLocaleString()} 人目の OPENer です！`;

      // 30秒タイマー起動
      let timeLeft = 30;
      const timerEl = document.getElementById('timer');
      
      const interval = setInterval(() => {
        timeLeft--;
        let sec = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        timerEl.innerText = `00:${sec}`;

        if (timeLeft <= 0) {
          clearInterval(interval);
          alert('30秒が経過しました。強制ログアウトします。');
          location.reload();
        }
      }, 1000);
    });
  </script>
</body>
</html>
